# ===========================
# PROFILE DE DESENVOLVIMENTO
# ===========================
spring.datasource.url=${DB_URL:jdbc:h2:mem:testdb}
spring.datasource.driverClassName=${DB_CLASSNAME:org.h2.Driver}
spring.datasource.username=${DB_USER:book}
spring.datasource.password=${DB_PASSWORD:123}
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Flyway - H2 usa as migrations adaptadas
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ====================
# CONFIGURAÇÃO DA LLM
# ====================

# Modelo de chat (para recomendações, enriquecimento e geração RAG)
langchain4j.ollama.chat-model.base-url=http://localhost:11434
langchain4j.ollama.chat-model.model-name=qwen2.5:14b
langchain4j.ollama.chat-model.temperature=0.7
langchain4j.ollama.chat-model.timeout=PT60S

# Modelo de embedding (para busca semântica)
langchain4j.ollama.embedding-model.base-url=http://localhost:11434
langchain4j.ollama.embedding-model.model-name=nomic-embed-text
langchain4j.ollama.embedding-model.timeout=PT60S