# ===========================
# PROFILE DE PRODUÇÃO
# ===========================
spring.datasource.url=${DB_URL}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# H2 Console desabilitado em produção
spring.h2.console.enabled=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ====================
# CONFIGURAÇÃO DA LLM
# ====================
langchain4j.ollama.chat-model.base-url=${OLLAMA_BASE_URL:http://host.docker.internal:11434}
langchain4j.ollama.chat-model.model-name=${OLLAMA_MODEL:qwen2.5:14b}
langchain4j.ollama.chat-model.temperature=0.7
langchain4j.ollama.chat-model.timeout=PT60S

langchain4j.ollama.embedding-model.base-url=${OLLAMA_BASE_URL:http://host.docker.internal:11434}
langchain4j.ollama.embedding-model.model-name=${OLLAMA_EMBED_MODEL:nomic-embed-text}
langchain4j.ollama.embedding-model.timeout=PT60S

spring.flyway.url=${DB_URL}
spring.flyway.user=${DB_USER}
spring.flyway.password=${DB_PASSWORD}
spring.flyway.baseline-on-migrate=true

# Solução alternativa de fallback para gerar as tabelas caso o Flyway não as crie
spring.jpa.hibernate.ddl-auto=update
